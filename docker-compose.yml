services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: assistant_ai_db
      POSTGRES_USER: assistant
      POSTGRES_PASSWORD: assistant_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assistant -d assistant_ai_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
